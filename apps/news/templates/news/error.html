{% extends "news/base.html" %}
{% block title %}오류 발생{% endblock %}

{% block content %}
<div style="text-align:center; padding: 4rem 0;">
  <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
  <h1 style="margin-bottom:0.5rem;">분석 중 오류가 발생했습니다</h1>
  <p style="color:#64748b; margin-bottom:1.5rem;">{{ report.query }}</p>
  <div class="card" style="text-align:left; max-width:560px; margin:0 auto 2rem;">
    <code style="font-size:0.82rem; color:#f87171; white-space:pre-wrap;">{{ report.error_message }}</code>
  </div>
  <a href="/" class="btn btn-primary">← 다시 시도</a>
</div>
{% endblock %}
