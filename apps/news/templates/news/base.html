<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}뉴스 요약봇{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f8;
      --surface:   #ffffff;
      --surface2:  #f4f6fb;
      --border:    #dde1ed;
      --accent:    #5b63f5;
      --accent2:   #7c6af7;
      --text:      #1e2235;
      --muted:     #7a82a0;
      --muted2:    #4e5672;
      --green:     #16a869;
      --yellow:    #d97706;
      --red:       #dc2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 네비 ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-logo {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-links a:hover { background: var(--surface2); color: var(--text); }

    /* ── 컨테이너 ── */
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    /* ── 카드 ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* ── 버튼 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:hover  { opacity: 0.88; }
    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-ghost    { background: var(--surface2); color: var(--muted2); border: 1px solid var(--border); }

    /* ── 폼 요소 ── */
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,114,248,0.12);
    }

    /* ── 배지 ── */
    .badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-search { background: #dbeafe; color: #1d4ed8; }
    .badge-rss    { background: #dcfce7; color: #15803d; }
    .badge-url    { background: #ede9fe; color: #6d28d9; }
    .badge-pdf    { background: #fef9c3; color: #a16207; }
    .badge-done   { background: #dcfce7; color: #15803d; }
    .badge-running{ background: #fef9c3; color: #a16207; }
    .badge-pending{ background: #f1f5f9; color: #64748b; }
    .badge-error  { background: #fee2e2; color: #b91c1c; }

    /* ── 테이블 ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid rgba(30,38,56,0.6);
      color: var(--muted2);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    td a { color: var(--accent2); text-decoration: none; }
    td a:hover { text-decoration: underline; }

    /* ── 신뢰도 바 ── */
    .conf-bar {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 0.35rem;
    }
    .conf-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width 0.8s ease;
    }

    /* ── 탭 ── */
    .tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 0.38rem 0.85rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover  { color: var(--text); border-color: var(--muted); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .empty { color: var(--muted); font-size: 0.875rem; padding: 0.75rem 0; }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <header class="nav">
    <a class="nav-logo" href="/">📰 뉴스 요약봇</a>
    <nav class="nav-links">
      <a href="/news/reports/">보고서 목록</a>
      <a href="/admin/">관리자</a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
